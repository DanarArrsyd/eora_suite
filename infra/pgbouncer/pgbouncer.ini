; EORA local/CI PgBouncer (doc 25 §7). Runtime role traffic only; migrations, provisioning and bootstrap connect directly.
[databases]
; the test database runs with a deliberately tiny pool so server connections are reused across clients (T-ISO-03)
eora_test = host=postgres port=5432 dbname=eora_test pool_size=2
* = host=postgres port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /tmp/userlist.txt
pool_mode = transaction
default_pool_size = 10
max_client_conn = 200
; protocol-level prepared statements across transactions (native PDO prepares, D-B1-09; needs libpq >= 17, D-056)
max_prepared_statements = 200
server_reset_query =
ignore_startup_parameters = extra_float_digits
logfile =
pidfile = /tmp/pgbouncer.pid
