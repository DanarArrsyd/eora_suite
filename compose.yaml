# EORA Suite — local development services (B0). Secrets come from ./.env (gitignored); see .env.example.
# Usage: cp .env.example .env && fill values, then `docker compose up -d --build --wait`.
name: eora

x-api-env: &api-env
  APP_NAME: 'EORA Suite API'
  APP_ENV: local
  APP_DEBUG: 'true'
  APP_KEY: ${EORA_APP_KEY:?set EORA_APP_KEY in .env}
  APP_URL: http://localhost:8000
  LOG_CHANNEL: stack
  LOG_STACK: json
  DB_CONNECTION: pgsql
  # runtime traffic goes through PgBouncer (transaction pooling, doc 25 §7); owner/provisioner connect directly
  DB_HOST: pgbouncer
  DB_PORT: '6432'
  DB_OWNER_HOST: postgres
  DB_OWNER_PORT: '5432'
  DB_DATABASE: ${EORA_DB_DATABASE:-eora}
  # runtime role (doc 25 §5.1) — never the bootstrap superuser or the migrations owner
  DB_USERNAME: eora_app
  DB_PASSWORD: ${EORA_DB_APP_PASSWORD}
  REDIS_CLIENT: predis
  REDIS_HOST: redis
  REDIS_PORT: '6379'
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: array
  # signed tenant context (D-055): same key as loaded into ctx.keys by db-bootstrap
  EORA_CTX_SIGNING_KID: kid1
  EORA_CTX_SIGNING_KEY: ${EORA_CTX_KEY_KID1:?set EORA_CTX_KEY_KID1 in .env (scripts/ensure-dev-secrets.sh)}
  # keyed hashes in security events (D-B1-22)
  EORA_PEPPER_KEY: ${EORA_PEPPER_KEY:?set EORA_PEPPER_KEY in .env (scripts/ensure-dev-secrets.sh)}

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${EORA_DB_DATABASE:-eora}
      POSTGRES_USER: ${EORA_DB_USERNAME:-eora}
      POSTGRES_PASSWORD: ${EORA_DB_PASSWORD:?set EORA_DB_PASSWORD in .env}
    ports:
      - '127.0.0.1:${EORA_DB_HOST_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    # Init SQL ships inline (no host bind mount), so it works wherever the repo lives — Docker Desktop
    # only shares /Users, /Volumes, /private, /tmp and /var/folders by default. Runs on a fresh volume only.
    configs:
      - source: postgres-init-test-db
        target: /docker-entrypoint-initdb.d/01-test-database.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.6-alpine
    command: ['redis-server', '--appendonly', 'no', '--save', '']
    ports:
      - '127.0.0.1:${EORA_REDIS_HOST_PORT:-6380}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot, idempotent role/schema bootstrap (doc 25 §5.1/§9 step 0, D-057). Only this service holds the bootstrap
  # superuser credentials; the API connects as eora_app and migrates as eora_owner. Never drops anything.
  db-bootstrap:
    build:
      context: ./apps/api
    image: eora-api:dev
    entrypoint: ['sh', 'database/bootstrap/bootstrap.sh']
    restart: 'no'
    environment:
      PGHOST: postgres
      PGUSER: ${EORA_DB_USERNAME:-eora}
      PGPASSWORD: ${EORA_DB_PASSWORD}
      EORA_BOOTSTRAP_DATABASES: ${EORA_DB_DATABASE:-eora} eora_test
      EORA_DB_OWNER_PASSWORD: ${EORA_DB_OWNER_PASSWORD:?set EORA_DB_OWNER_PASSWORD in .env (scripts/ensure-dev-secrets.sh)}
      EORA_DB_APP_PASSWORD: ${EORA_DB_APP_PASSWORD:?set EORA_DB_APP_PASSWORD in .env}
      EORA_DB_AUTH_WEB_PASSWORD: ${EORA_DB_AUTH_WEB_PASSWORD:?set EORA_DB_AUTH_WEB_PASSWORD in .env}
      EORA_DB_AUTH_DELIVERY_PASSWORD: ${EORA_DB_AUTH_DELIVERY_PASSWORD:?set EORA_DB_AUTH_DELIVERY_PASSWORD in .env}
      EORA_DB_PROVISIONER_PASSWORD: ${EORA_DB_PROVISIONER_PASSWORD:?set EORA_DB_PROVISIONER_PASSWORD in .env}
      EORA_DB_RELAY_PASSWORD: ${EORA_DB_RELAY_PASSWORD:?set EORA_DB_RELAY_PASSWORD in .env}
      EORA_CTX_KEYS: kid1:${EORA_CTX_KEY_KID1:?set EORA_CTX_KEY_KID1 in .env}
    depends_on:
      postgres:
        condition: service_healthy

  # One-shot migrations as eora_owner (doc 25 §10: owner credentials only in the migration job's scope, never in the
  # long-running API). Also the runner for the backend test suite, which needs the owner for group A schema tests:
  #   docker compose run --rm db-migrate                                  (migrate the dev database)
  #   docker compose run --rm --entrypoint vendor/bin/pest db-migrate     (tests; phpunit.xml forces eora_test)
  db-migrate:
    image: eora-api:dev
    entrypoint: ['php', 'artisan', 'migrate', '--database=pgsql_owner', '--force']
    restart: 'no'
    environment:
      <<: *api-env
      DB_OWNER_USERNAME: eora_owner
      DB_OWNER_PASSWORD: ${EORA_DB_OWNER_PASSWORD}
      # test fixtures create tenants the way provisioning does (doc 25 §2.5); group C tests call the auth functions
      # as their real roles (doc 25 §11)
      DB_PROVISIONER_PASSWORD: ${EORA_DB_PROVISIONER_PASSWORD}
      DB_AUTH_WEB_PASSWORD: ${EORA_DB_AUTH_WEB_PASSWORD}
      DB_AUTH_DELIVERY_PASSWORD: ${EORA_DB_AUTH_DELIVERY_PASSWORD}
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy

  pgbouncer:
    build:
      context: ./infra/pgbouncer
    image: eora-pgbouncer:dev
    environment:
      EORA_DB_APP_PASSWORD: ${EORA_DB_APP_PASSWORD}
    healthcheck:
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 6432']
      interval: 3s
      timeout: 3s
      retries: 20
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully

  api:
    build:
      context: ./apps/api
    image: eora-api:dev
    # runtime role only (eora_app); no owner or superuser credentials in this container
    environment: *api-env
    ports:
      - '127.0.0.1:${EORA_API_HOST_PORT:-8000}:8000'
    depends_on:
      db-migrate:
        condition: service_completed_successfully

configs:
  postgres-init-test-db:
    # Local/CI only: separate database for automated tests (phpunit.xml forces DB_DATABASE=eora_test).
    content: |
      CREATE DATABASE eora_test;

volumes:
  pgdata:
