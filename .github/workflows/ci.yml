# Quality gates: frontend (docs/22 §4), backend B0 foundation (docs/10, doc 11 B0) and Docker Compose validation.
# Runs on GitHub-hosted runners since the initial push (D-050). pnpm is invoked via npx (no global install),
# so setup-node must not try to resolve a pnpm binary for its package-manager cache.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'
  PNPM: npx -y pnpm@12.10.1

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install
        run: $PNPM install --frozen-lockfile
      - name: Format
        run: $PNPM format:check
      - name: Typecheck
        run: $PNPM typecheck
      - name: Lint
        run: $PNPM lint
      - name: Unit and component tests
        run: $PNPM test
      - name: Production build
        run: $PNPM build
      - name: Install Google Chrome for Playwright
        working-directory: apps/web
        run: npx playwright install --with-deps chrome
      - name: E2E (responsive, accessibility, keyboard, media preferences)
        working-directory: apps/web
        run: npx playwright test --workers=2

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api
    env:
      # Ephemeral CI-only credentials for the throwaway service containers below (not a secret).
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: eora_test
      # runtime role and migrations owner created by the bootstrap step (doc 25 §5.1); the service superuser is used
      # only by that step
      DB_USERNAME: eora_app
      DB_PASSWORD: ci-only-throwaway-app-0000000000
      DB_OWNER_USERNAME: eora_owner
      DB_OWNER_PASSWORD: ci-only-throwaway-owner-00000000
      DB_PROVISIONER_PASSWORD: ci-only-throwaway-prov-000000000
      DB_AUTH_WEB_PASSWORD: ci-only-throwaway-authweb-000000
      DB_AUTH_DELIVERY_PASSWORD: ci-only-throwaway-delivery-00000
      # throwaway signed-context key (D-055), CI only; the same value is loaded into ctx.keys by the bootstrap step
      EORA_CTX_SIGNING_KID: kid1
      # D-067: shared-runner regression ceiling for the verifier gate (reference hardware budget stays 15 us, D-055)
      EORA_PERF_VERIFIER_BUDGET_US: '25'
      EORA_PEPPER_KEY: d2000000d2000000d2000000d2000000d2000000d2000000d2000000d2000000
      EORA_CTX_SIGNING_KEY: c1000000c1000000c1000000c1000000c1000000c1000000c1000000c1000000
      REDIS_CLIENT: predis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: eora_test
          POSTGRES_USER: eora
          POSTGRES_PASSWORD: ci-only-throwaway
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U eora -d eora_test" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8.6-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, intl, bcmath, zip
          coverage: none
          tools: composer:v2
      - name: libpq version (diagnostic; native prepares through PgBouncer need >= 17, enforced in the docker job)
        run: php -i | grep -m1 'PostgreSQL(libpq) Version' || true
      - name: Database bootstrap (roles, schemas, base privileges)
        env:
          PGHOST: 127.0.0.1
          PGUSER: eora
          PGPASSWORD: ci-only-throwaway
          EORA_BOOTSTRAP_DATABASES: eora_test
          EORA_DB_OWNER_PASSWORD: ci-only-throwaway-owner-00000000
          EORA_DB_APP_PASSWORD: ci-only-throwaway-app-0000000000
          EORA_DB_AUTH_WEB_PASSWORD: ci-only-throwaway-authweb-000000
          EORA_DB_AUTH_DELIVERY_PASSWORD: ci-only-throwaway-delivery-00000
          EORA_DB_PROVISIONER_PASSWORD: ci-only-throwaway-prov-000000000
          EORA_DB_RELAY_PASSWORD: ci-only-throwaway-relay-00000000
          EORA_CTX_KEYS: kid1:c1000000c1000000c1000000c1000000c1000000c1000000c1000000c1000000
        run: |
          sh database/bootstrap/bootstrap.sh
          sh database/bootstrap/bootstrap.sh   # idempotency: a second run must succeed and change nothing harmful
      - name: Validate composer.json and lock
        run: composer validate --strict
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Dependency audit
        run: composer audit
      - name: Prepare environment
        run: cp .env.example .env && php artisan key:generate --ansi
      - name: Format (Pint)
        run: vendor/bin/pint --test
      - name: Static analysis (Larastan level 8)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress
      - name: Application boot
        run: php artisan about --only=environment && php artisan route:list --path=api
      - name: Migrations as the migrations owner, with a rollback round trip (doc 25 §10)
        run: |
          php artisan migrate --database=pgsql_owner --force
          php artisan migrate:refresh --database=pgsql_owner --force
      - name: Tests (unit, feature, architecture, integration)
        run: vendor/bin/pest
      - name: OpenAPI drift check
        run: |
          composer openapi:export
          git diff --exit-code -- ../../packages/api-client/openapi.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Typed client drift check
        working-directory: packages/api-client
        run: |
          npx -y openapi-typescript@7.13.0 openapi.json -o src/schema.d.ts
          git diff --exit-code -- src/schema.d.ts

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EORA_DB_PASSWORD: ci-only-throwaway
      EORA_DB_OWNER_PASSWORD: ci-only-throwaway-owner-00000000
      EORA_DB_APP_PASSWORD: ci-only-throwaway-app-0000000000
      EORA_DB_AUTH_WEB_PASSWORD: ci-only-throwaway-authweb-000000
      EORA_DB_AUTH_DELIVERY_PASSWORD: ci-only-throwaway-delivery-00000
      EORA_DB_PROVISIONER_PASSWORD: ci-only-throwaway-prov-000000000
      EORA_DB_RELAY_PASSWORD: ci-only-throwaway-relay-00000000
      EORA_PEPPER_KEY: d2000000d2000000d2000000d2000000d2000000d2000000d2000000d2000000
      EORA_CTX_KEY_KID1: c1000000c1000000c1000000c1000000c1000000c1000000c1000000c1000000
    steps:
      - uses: actions/checkout@v5
      - name: Validate compose file
        run: |
          echo "EORA_APP_KEY=base64:$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          EORA_APP_KEY=placeholder docker compose config --quiet
      - name: Start services and wait for health
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: API image uses libpq >= 17 (D-056 P-05)
        run: |
          docker compose exec -T api php -i | grep -m1 'PostgreSQL(libpq) Version' | tee libpq.txt
          major=$(sed -n 's/.*=> \([0-9]*\).*/\1/p' libpq.txt)
          test "$major" -ge 17
      - name: API health checks
        run: |
          curl -fsS http://127.0.0.1:8000/api/v1/health
          curl -fsS http://127.0.0.1:8000/api/v1/health/ready | tee ready.json
          grep -q '"status":"ok"' ready.json
      - name: Init SQL created the test database (fresh volume)
        run: |
          docker compose exec -T postgres psql -U eora -d postgres -Atc \
            "select datname from pg_database where datname = 'eora_test'" | grep -qx eora_test
      - name: Backend tests in the one-shot migrate container never touch the dev database
        # The container sets APP_ENV=local and DB_DATABASE=eora; phpunit.xml must force the test config.
        # migrate:fresh would recreate the eora tables, so their OIDs must not change.
        run: |
          # the dev database was migrated by the one-shot db-migrate service during `up`; the owner credentials live
          # only there (doc 25 §10), so test-database migrations and the suite run in that service's container too
          q="select string_agg(c.relname || ':' || c.oid, ',' order by c.relname) from pg_class c join pg_namespace n on n.oid = c.relnamespace where n.nspname = 'public' and c.relkind = 'r'"
          before=$(docker compose exec -T postgres psql -U eora -d eora -Atc "$q")
          docker compose run --rm -T -e DB_DATABASE=eora_test db-migrate
          docker compose run --rm -T -e EORA_PERF_VERIFIER_BUDGET_US=25 --entrypoint vendor/bin/pest db-migrate
          after=$(docker compose exec -T postgres psql -U eora -d eora -Atc "$q")
          echo "eora tables before: $before"
          echo "eora tables after:  $after"
          test -n "$before" && test "$before" = "$after"
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop services
        if: always()
        run: docker compose down -v
